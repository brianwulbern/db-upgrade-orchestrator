# release_sets.conf — map an upgrade-bundle version to the set of databases to validate.
# make_manifest.sh --for-version <ver> matches <ver> against these globs (first match wins) and
# builds the manifest from the catalog filtered to that set. Fake sets for the demo.
#
# Format:  <version-glob> = <space-separated modls>   |   ALL
line-a* = customer-a customer-b customer-c
line-b* = customer-d customer-e customer-f
* = ALL
